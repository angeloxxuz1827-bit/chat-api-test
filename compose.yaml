services:
  api:
    build: .
    image: fastapi-bedrock:0.1.0
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - "${CHAT_API_ENV_FILE:-.env}"
    restart: unless-stopped
    # Local: descomenta y ajusta la ruta para que boto3 use tus credenciales.
    # En EC2 no hace falta: el rol de instancia las proporciona.
    # volumes:
    #   - C:/Users/tu-usuario/.aws:/home/appuser/.aws:ro
